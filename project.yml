# Definizione XcodeGen di riserva.
# ClearSpace.xcodeproj è già incluso: questo file serve solo a rigenerarlo
# (`brew install xcodegen && xcodegen generate`) se Xcode non riuscisse ad aprirlo.
name: ClearSpace
options:
  bundleIdPrefix: com.example
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearSpace:
    type: application
    platform: iOS
    sources:
      - ClearSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClearSpace
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ClearSpace
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  ClearSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearSpaceTests
    dependencies:
      - target: ClearSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClearSpaceTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClearSpace:
    build:
      targets:
        ClearSpace: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearSpaceTests
    archive:
      config: Release
