# Compila l'app e avvia i test unitari su un runner macOS di GitHub.
# I log completi vengono salvati come artefatti; nel riepilogo compaiono solo errori e risultati.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|candidate" | sort -V | tail -1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Sceglie un simulatore iPhone
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for r in runtimes for d in devices[r] if 'iPhone' in d['name']))
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$DEVICE_ID"

      - name: Compilazione di app e test
        run: |
          set +e
          xcodebuild build-for-testing \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > build.log 2>&1
          STATUS=$?
          echo "Errori distinti: $(grep -E 'error:' build.log | sort -u | wc -l | tr -d ' ')"
          echo "Avvisi distinti: $(grep -E 'warning:' build.log | sort -u | wc -l | tr -d ' ')"
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -400
          tail -n 3 build.log
          exit $STATUS

      - name: Test unitari
        run: |
          set +e
          xcodebuild test-without-building \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > test.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case .* failed|Test Suite 'All tests'|Executed [0-9]+ tests" test.log \
            | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -300
          tail -n 3 test.log
          exit $STATUS

      - name: Salva i log completi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
