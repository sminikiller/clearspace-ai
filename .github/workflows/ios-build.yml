# Compila l'app, esegue i test unitari e una prova d'uso sul simulatore, su un runner macOS di GitHub.
# Nel riepilogo compaiono solo errori e risultati; log completi e schermate sono salvati come artefatti.
name: iOS build

on:
  push:
    branches: [main]
    # Le modifiche alla sola documentazione non consumano minuti macOS.
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    # Compilazione, test unitari, prova d'uso e giro con il testo grande richiedono ormai 35-40 minuti:
    # con 45 il lavoro rischiava di essere interrotto a un passo dalla fine.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|candidate" | sort -V | tail -1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Sceglie un simulatore iPhone
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for r in runtimes for d in devices[r] if 'iPhone' in d['name']))
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$DEVICE_ID"

      - name: Compilazione di app e test
        id: build
        run: |
          set +e
          xcodebuild build-for-testing \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > build.log 2>&1
          STATUS=$?
          echo "Errori distinti: $(grep -E 'error:' build.log | sort -u | wc -l | tr -d ' ')"
          echo "Avvisi distinti: $(grep -E 'warning:' build.log | grep -v appintentsmetadataprocessor | sort -u | wc -l | tr -d ' ')"
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -400
          grep -E "warning:" build.log | grep -v appintentsmetadataprocessor | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60
          tail -n 3 build.log
          exit $STATUS

      # Le foto di esempio del simulatore sono tutte diverse: senza questi contenuti il riconoscimento
      # delle foto simili, la scelta dello scatto migliore e il lettore video non verrebbero mai provati.
      - name: Prepara foto simili e un video di prova
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/media"
          swift scripts/make-test-media.swift "$RUNNER_TEMP/media" > media.log 2>&1
          tail -n 12 media.log
          xcrun simctl bootstatus "$DEVICE_ID" -b > /dev/null 2>&1
          PHOTOS=$(ls "$RUNNER_TEMP"/media/*.jpg 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PHOTOS" -ge 3 ] && xcrun simctl addmedia "$DEVICE_ID" "$RUNNER_TEMP"/media/*.jpg; then
            echo "Foto simili aggiunte al simulatore: $PHOTOS"
            echo "TEST_RUNNER_SEEDED_MEDIA=1" >> "$GITHUB_ENV"
            VIDEOS=$(ls "$RUNNER_TEMP"/media/*.mp4 2>/dev/null | wc -l | tr -d ' ')
            if [ "$VIDEOS" -ge 1 ] && xcrun simctl addmedia "$DEVICE_ID" "$RUNNER_TEMP"/media/*.mp4; then
              echo "Video di prova aggiunti al simulatore: $VIDEOS"
              echo "TEST_RUNNER_SEEDED_VIDEO=1" >> "$GITHUB_ENV"
              # Con due riprese quasi uguali si prova anche il gruppo di video simili.
              if [ "$VIDEOS" -ge 2 ]; then echo "TEST_RUNNER_SEEDED_VIDEO_PAIR=1" >> "$GITHUB_ENV"; fi
            else
              echo "Video di prova non disponibile: la prova sul video verrà saltata"
            fi
          else
            echo "Contenuti di prova non disponibili: le prove su foto simili e video verranno saltate"
          fi
          exit 0

      - name: Test unitari
        run: |
          set +e
          xcodebuild test-without-building \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClearSpaceTests \
            -parallel-testing-enabled NO \
            > test.log 2>&1
          STATUS=$?
          echo "Test passati: $(grep -ciE 'test case .* passed' test.log)"
          echo "Test falliti: $(grep -ciE 'test case .* failed' test.log)"
          grep -iE "error:|test case .* failed" test.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -200
          grep -E "TEST EXECUTE" test.log
          exit $STATUS

      - name: Prova d'uso sul simulatore
        id: smoke
        run: |
          set +e
          xcodebuild test-without-building \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClearSpaceUITests/SmokeTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            > uitest.log 2>&1
          STATUS=$?
          echo "Prove passate: $(grep -ciE 'test case .* passed' uitest.log)"
          echo "Prove fallite: $(grep -ciE 'test case .* failed' uitest.log)"
          grep -iE "error:|test case .* failed" uitest.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -100
          grep -E "TEST EXECUTE" uitest.log
          exit $STATUS

      # Molti iPhone usano il testo ingrandito e il tema scuro: il giro di tutte le schermate in queste
      # condizioni scopre testi che escono dallo schermo, pulsanti irraggiungibili e colori illeggibili.
      - name: Prova del layout con testo grande e tema scuro
        if: always() && steps.build.outcome == 'success'
        run: |
          set +e
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcodebuild test-without-building \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClearSpaceUITests/LayoutTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/LayoutTests.xcresult" \
            > layout.log 2>&1
          STATUS=$?
          echo "Prove passate: $(grep -ciE 'test case .* passed' layout.log)"
          echo "Prove fallite: $(grep -ciE 'test case .* failed' layout.log)"
          grep -iE "error:" layout.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -150
          grep -E "TEST EXECUTE" layout.log
          exit $STATUS

      - name: Esporta le schermate
        if: always()
        run: |
          export_shots() {
            mkdir -p "$2"
            [ -d "$1" ] || { echo "Nessun risultato in $1"; return; }
            xcrun xcresulttool export attachments --path "$1" --output-path "$2" || echo "Esportazione non riuscita: $1"
            python3 - "$2" <<'PY'
          import json, os, re, sys
          folder = sys.argv[1]
          manifest = os.path.join(folder, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      source = os.path.join(folder, item.get("exportedFileName", ""))
                      label = item.get("suggestedHumanReadableName") or ""
                      label = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", label)
                      if os.path.isfile(source) and label:
                          os.replace(source, os.path.join(folder, re.sub(r"[^\w.\-]", "_", label)))
          PY
          }
          export_shots "$RUNNER_TEMP/UITests.xcresult" shots
          export_shots "$RUNNER_TEMP/LayoutTests.xcresult" shots-layout
          # Copie ridotte delle schermate del layout, comode da controllare tutte insieme.
          mkdir -p shots-layout-small
          for file in shots-layout/*.png; do
            [ -f "$file" ] && sips --resampleWidth 560 "$file" --out "shots-layout-small/$(basename "$file")" > /dev/null
          done
          ls shots | head -80
          ls shots-layout-small | head -120

      - name: Salva schermate e log completi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati
          path: |
            build.log
            media.log
            test.log
            uitest.log
            layout.log
            shots
            shots-layout-small
          if-no-files-found: ignore
          retention-days: 7
