# Crea l'archivio di distribuzione e lo carica su App Store Connect (TestFlight).
# Si avvia a mano dalla scheda Actions. Richiede i segreti e le variabili descritti nel README.
#
# La firma usa i certificati gestiti da Apple ("cloud signing"): non servono file .p12
# né profili da caricare, basta una chiave API di App Store Connect con ruolo Admin.
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Identificativi (non segreti): variabili del repository, con i segreti omonimi come alternativa.
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID || secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || secrets.ASC_ISSUER_ID }}
      # L'unico vero segreto: il contenuto del file .p8.
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la configurazione
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Manca $name: vedi la sezione TestFlight del README."
              missing=1
            fi
          done
          exit $missing

      - name: Seleziona Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|candidate" | sort -V | tail -1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Prepara la chiave di App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Toglie gli eventuali ritorni a capo di Windows aggiunti salvando il segreto da PowerShell.
          printf '%s\n' "$ASC_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archivio (senza firma)
        run: |
          set +e
          xcodebuild archive \
            -project ClearSpace.xcodeproj \
            -scheme ClearSpace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ClearSpace.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > archive.log 2>&1
          STATUS=$?
          grep -E "error:" archive.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -200
          tail -n 3 archive.log
          exit $STATUS

      # Di solito ci mette un paio di minuti: se il collegamento con Apple si blocca, meglio
      # fermarsi presto e riprovare che occupare il runner per un'ora.
      - name: Firma e carica su App Store Connect
        timeout-minutes: 20
        run: |
          set +e
          sed "s/__TEAM_ID__/$TEAM_ID/" Config/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ClearSpace.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1
          STATUS=$?
          grep -E "error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)" export.log | sort -u | head -100
          tail -n 5 export.log
          exit $STATUS

      - name: Rimuove la chiave dal runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Salva i log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
